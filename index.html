<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bengali Script Learner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Bengali Script Learner</h1>
            <p>Learn the Bengali script by matching Hindi letters to their Bengali counterparts.</p>
        </header>

        <main>
            <div class="progress-container">
                <h2>Your Progress</h2>
                <div class="progress-bar">
                    <div class="progress" id="progress"></div>
                </div>
                <p id="progress-text">0%</p>
            </div>

            <div class="quiz-container">
                <div class="question-card">
                    <p>The Hindi letter is:</p>
                    <h2 id="question"></h2>
                </div>

                <div class="options-grid" id="options">
                    <!-- Options will be dynamically inserted here -->
                </div>

                <div class="feedback" id="feedback">
                    <!-- Feedback will be shown here -->
                </div>

                <button id="next-btn" class="hidden">Next Question</button>
            </div>

            <div class="controls-container">
                <h2>Lesson Controls</h2>
                <div class="character-type-selector">
                    <label><input type="checkbox" id="vowels-checkbox" checked> Vowels</label>
                    <label><input type="checkbox" id="consonants-checkbox" checked> Consonants</label>
                    <label><input type="checkbox" id="matras-checkbox"> Matras (Vowel Signs)</label>
                    <label><input type="checkbox" id="signs-checkbox"> Signs</label>
                </div>
                <button id="reset-progress-btn">Reset Progress</button>
            </div>
        </main>

        <footer>
            <p>Created with AI assistance.</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
